[package]
name = "eval-py"
version = "0.1.0"
edition = "2024"

[lib]
name = "plugin"
crate-type = ["cdylib"]

[dependencies]
extism-pdk = "1.4"
libc = "=0.2.178"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rustpython-vm = { version = "0.4", default-features = false, features = ["compiler"] }
base64-serde = "0.8"
base64 = "0.22"

[profile.release]
lto = true
opt-level = 's'
strip = true

[target.wasm32-wasip1.dependencies]
getrandom = { version = "0.2", features = ["js"] }
